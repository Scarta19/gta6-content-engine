[project]
name = "gta6-content-engine"
version = "0.1.0"
description = "Lean pipeline for verified, rights-reviewed GTA VI short-form videos."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.40",
    "feedparser>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
# Clipping mode: local transcription and VOD download. faster-whisper 1.2 breaks on PyAV 18+.
clips = ["faster-whisper>=1.1", "av>=12,<18", "yt-dlp>=2024.1"]

[project.scripts]
gce = "gce.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gce"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs ffmpeg on PATH"]
